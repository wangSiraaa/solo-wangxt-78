version: "3.9"
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: webhookd
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 2s
      timeout: 3s
      retries: 20
    volumes:
      - pgdata:/var/lib/postgresql/data

  webhookd:
    build: ..
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://postgres:postgres@postgres:5432/webhookd?sslmode=disable
      HTTP_ADDR: :8080
      DELIVERY_WORKERS: "4"
      ENABLE_TESTKIT: "true"
      # Dev convenience ONLY: lets endpoints point at the local testkit.
      # Never set this in production.
      ALLOW_PRIVATE_HOSTS: "127.0.0.1/32"
    ports:
      - "8080:8080"

volumes:
  pgdata:
